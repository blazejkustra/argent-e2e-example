steps:
  - echo: Fresh launch, signed-out user
  # Restart the app; app data is kept
  - launch: com.example.shop
  - await: { visible: { id: home-screen } }
  - tap: { id: search-tab }
  # Types and presses Enter
  - type: { into: { id: search-input }, text: running shoes }
  - await: { visible: { id: search-results } }
  # A regex, so any number of results passes
  - assert: { text: { in: { id: result-count }, matches: '^\d+ results$' } }
